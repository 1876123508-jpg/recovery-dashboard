name: Update Dashboard from Feishu

on:
  schedule:
    # Every Monday 00:30 UTC = 08:30 Beijing time
    - cron: '30 0 * * 1'
  workflow_dispatch: # allow manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build dashboard from Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WIKI_TOKEN: YOLNwm8Oritw0jkU8sQcVa8tn1g
          FEISHU_SHEET_ID: zXC4uk
        run: node scripts/build.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to index.html"
          else
            git commit -m "Update dashboard $(date +%F)"
            git push
          fi